[project]
name = "tsf-sizer"
version = "0.1.0"
description = "Firewall replacement sizing from PAN-OS Tech Support Files"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
tsf-sizer = "tsf_sizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tsf_sizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# One mapping per line reads better than wrapped tuples.
"tsf_sizer/portfolio/mapping.py" = ["E501"]
