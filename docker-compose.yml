services:
  tsf-sizer:
    build: .
    image: tsf-sizer:latest
    container_name: tsf-sizer
    ports:
      # Default: reachable from the network on every address of this machine. The app
      # handles customer data: set TSF_SIZER_USER and TSF_SIZER_PASSWORD (e.g. in .env),
      # or restrict it to this machine with TSF_SIZER_BIND=127.0.0.1. Change the host
      # port with TSF_SIZER_PORT. For a shared server put a reverse proxy with HTTPS
      # in front.
      - "${TSF_SIZER_BIND:-0.0.0.0}:${TSF_SIZER_PORT:-8088}:8088"
    volumes:
      - tsf-sizer-data:/data
      # A gateway with a private certificate: mount the CA and set TSF_SIZER_GATEWAY_CA_BUNDLE
      # (/certs/ca.pem). A key from a file: mount it and set TSF_SIZER_GATEWAY_API_KEY_FILE.
      # - ./certs:/certs:ro
    environment:
      # Optional login (HTTP basic auth). Set both to enable it.
      TSF_SIZER_USER: ${TSF_SIZER_USER:-}
      TSF_SIZER_PASSWORD: ${TSF_SIZER_PASSWORD:-}
      TSF_SIZER_MAX_UPLOAD_MB: ${TSF_SIZER_MAX_UPLOAD_MB:-1024}
      # The agent reaches its LLM through the Prisma AIRS AI Gateway. Off until a mode is set.
      # Credentials come from the environment only (or a mounted file: NAME_FILE).
      # See .env.example and the Settings page.
      TSF_SIZER_LLM_MODE: ${TSF_SIZER_LLM_MODE:-off}
      TSF_SIZER_GATEWAY_URL: ${TSF_SIZER_GATEWAY_URL:-}
      TSF_SIZER_GATEWAY_API_KEY: ${TSF_SIZER_GATEWAY_API_KEY:-}
      TSF_SIZER_GATEWAY_API_KEY_FILE: ${TSF_SIZER_GATEWAY_API_KEY_FILE:-}
      TSF_SIZER_GATEWAY_MODEL: ${TSF_SIZER_GATEWAY_MODEL:-}
      TSF_SIZER_GATEWAY_AUTH_HEADER: ${TSF_SIZER_GATEWAY_AUTH_HEADER:-}
      TSF_SIZER_GATEWAY_AUTH_SCHEME: ${TSF_SIZER_GATEWAY_AUTH_SCHEME-Bearer}
      TSF_SIZER_GATEWAY_HEADERS: ${TSF_SIZER_GATEWAY_HEADERS:-}
      TSF_SIZER_GATEWAY_CHAT_PATH: ${TSF_SIZER_GATEWAY_CHAT_PATH:-}
      TSF_SIZER_GATEWAY_CA_BUNDLE: ${TSF_SIZER_GATEWAY_CA_BUNDLE:-}
      TSF_SIZER_GATEWAY_VERIFY_TLS: ${TSF_SIZER_GATEWAY_VERIFY_TLS:-true}
      TSF_SIZER_GATEWAY_TIMEOUT_S: ${TSF_SIZER_GATEWAY_TIMEOUT_S:-120}
      TSF_SIZER_GATEWAY_MAX_RETRIES: ${TSF_SIZER_GATEWAY_MAX_RETRIES:-2}
      TSF_SIZER_GATEWAY_TOOL_MODE: ${TSF_SIZER_GATEWAY_TOOL_MODE:-auto}
      TSF_SIZER_AGENT_MAX_STEPS: ${TSF_SIZER_AGENT_MAX_STEPS:-40}
      # Development only (an OpenAI-compatible server, e.g. Ollama's /v1 endpoint):
      TSF_SIZER_DIRECT_URL: ${TSF_SIZER_DIRECT_URL:-}
      TSF_SIZER_DIRECT_MODEL: ${TSF_SIZER_DIRECT_MODEL:-}
      TSF_SIZER_DIRECT_API_KEY: ${TSF_SIZER_DIRECT_API_KEY:-}
    extra_hosts:
      # Lets the container reach a service running on this machine (development mode)
      # as http://host.docker.internal:<port> (built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  tsf-sizer-data:
